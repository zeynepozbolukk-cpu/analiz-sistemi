body{padding-top:24px}

    tools:{text:['ChatGPT','Canva DreamLab'], image:['Prome AI','Leonardo AI']},
    vize:{
      past:`A fantastical walking castle inspired by steampunk and fairy-tale aesthetics, built as a patchwork of small houses, chimneys, pipes, and mechanical legs. The composition is irregular and chaotic. Rotating gears, smoke rising from chimneys, and moving metal fragments make it look as if it has been assembled from scrap buildings and discarded materials. It walks on four metal legs through a lush green valley. The exterior is detailed with rusty iron, wood, and stone. Small windows, balconies, and doors are randomly scattered across the surface. The cloudy sky and dramatic lighting create a magical yet mysterious atmosphere. In the foreground, distant mountains and flowers complete the vivid landscape. The structure seems almost human, as if it had eyes and a mouth, though it actually does not.`,
      present:`A fantastical walking castle inspired by steampunk and fairy-tale aesthetics, built as a patchwork of small houses, chimneys, pipes, and mechanical legs. The composition is irregular and chaotic. Rotating gears, smoke rising from chimneys, and moving metal fragments make it look as if it has been assembled from scrap buildings and discarded materials. It walks on four metal legs through a lush green valley. The exterior is detailed with rusty iron, wood, and stone. Small windows, balconies, and doors are randomly scattered across the surface. The cloudy sky and dramatic lighting create a magical yet mysterious atmosphere. In the foreground, distant mountains and flowers complete the vivid landscape. The structure seems almost human, as if it had eyes and a mouth, though it actually does not. Imagine this space in the year 2025, with apartment blocks and skyscrapers replacing the old houses around it.`,
      future:`A fantastical walking castle inspired by steampunk and fairy-tale aesthetics, built as a patchwork of small houses, chimneys, pipes, and mechanical legs. The composition is irregular and chaotic. Rotating gears, smoke rising from chimneys, and moving metal fragments make it look as if it has been assembled from scrap buildings and discarded materials. It walks on four metal legs through a lush green valley. The exterior is detailed with rusty iron, wood, and stone. Small windows, balconies, and doors are randomly scattered across the surface. The cloudy sky and dramatic lighting create a magical yet mysterious atmosphere. In the foreground, distant mountains and flowers complete the vivid landscape. The structure seems almost human, as if it had eyes and a mouth, though it actually does not. Imagine this space in the year 3000 as an alien base.`,
      images:{past:'o1_vize_past.jpg',present:'o1_vize_present.jpg',future:'o1_vize_future.jpg'}
    },
    final:{
      past:`A walking castle in the mountains at the end of the nineteenth century. From the outside, the structure looks like a combination of many different buildings. Chimneys rise from every side, and steam escapes from several openings. The castle moves slowly on metal legs, appearing rusty and old, yet strangely alive. Its liveliness is suggested not only by movement but also by facial-like elements resembling eyes and a mouth. Windows, balconies, and doors are scattered in an irregular way. Stone, wood, and iron are layered together across the surface. The sky is partially overcast, but beams of light filtering through the clouds make the castle appear even more magical. It moves through a lush valley among the mountains. At first glance it seems chaotic, but on closer inspection each detail feels meaningful.`,
      present:`Imagine this castle in the year 2025. The structure still appears as a hybrid of multiple buildings combined into one. It is reinterpreted in an industrial style and moves slowly on metal legs like a living structure. Its facial quality is still visible through eye-like and mouth-like forms. Around it stand apartment blocks clad in glass and aluminum facades. Windows, balconies, and doors remain irregularly placed. The sky is slightly overcast, and shafts of light make the building more dramatic. Many other walking structures exist around it. The environment is relatively ordered, yet still carries a controlled sense of chaos.`,
      future:`We are inside the grand reception hall of an old stone castle. The room has a high ceiling supported by thick wooden beams. Along the walls stretch bookshelves filled with books placed in an irregular manner. At the center stands a large solid oak table surrounded by simple wooden stools, each slightly different from the others. Near the fireplace sits a red velvet French armchair. The fire burns low, casting dim warmth and soft light. Narrow arched windows close to the entrance admit only weak daylight, creating an almost prison-like mood. The space is generally dark, cluttered, and enclosed. Cobwebs and books scattered on the floor emphasize a long-abandoned and untouched atmosphere.`,
      images:{past:'o1_final_past.jpg',present:'o1_final_present.jpg',future:'o1_final_future.jpg'}
    }
  },
  {
    id:'Ö-02', artworkName:'UP', artworkType:'film',
    tools:{text:['ChatGPT'], image:['ChatGPT']},
    vize:{
      past:`The time is the twelfth century. Stones rise from the earth, pointed arches reach toward the sky, stained-glass windows filter light, and cathedrals are built with prayer. In this age, while people try to get closer to God by stacking stone upon stone, someone believes in something else entirely: a woman, a dream. Carl and Ellie first encountered dreams in an attic in childhood. Even centuries later, one thing remains unchanged: the desire to spend a lifetime together. In this era without the modern world, Carl remains faithful to the promise he made as a child. He wants to tie an entire life devoted to Ellie to the sky. This is not a modern city and not an age adorned with technology. It is a time shaped only by hands and imagination. Carl is not a master mason, but he is stubborn. He builds a house of stone walls, Gothic arches, and stained glass. Yet this house is more than a cathedral. Hundreds of balloons bind it to the sky. Ellie’s early loss does not stop Carl. He still fulfills their plan, because the adventure does not end there.`,
      present:`In today’s world, cities change quickly; buildings rise, streets become crowded, and everything turns digital. Time seems to move faster than people. Yet in the middle of all this chaos, a small house still resists. A tiny house held to the sky by colorful balloons. A place that slows time, refuses to forget memories, and keeps the warmth of the past alive within the present. Carl is still there, together with Ellie’s memory. The house still appears old from the outside, but inside it reaches toward today with small touches: perhaps a solar panel on the roof, perhaps a small digital screen next to the old radio. A corner still holds Ellie’s chair, untouched and exactly as it was. This house no longer lives entirely in the past, yet its heart remains analog.`,
      future:`The world has changed. Nature and technology have collided, cities have collapsed, and humanity has retreated underground. Yet in the sky there still hangs a house: small, stubborn, unforgettable. The house Carl built with Ellie has become the final emblem of love, loyalty, and memory in a world that has forgotten emotion. The balloons are no longer ordinary balloons; they are glowing, pulsating organisms, almost alive. People visit the house as a monument to love. In a ruined future, this floating structure reminds them that if love can remain, perhaps everything can become possible again. The interior is filled not with technology but with earth, memory, and affection.`,
      images:{past:'o2_vize_past.jpg',present:'o2_vize_present.jpg',future:'o2_vize_future.jpg'}
    },
    final:{

      present:`Carl’s flying house from Pixar’s Up is relocated into a present-day suburban setting. The house retains its original character but is updated with contemporary materials such as steel and glass. Solar panels cover the roof. The colorful balloons remain, though slightly faded and worn. The house hovers very close to the ground, casting a soft shadow. In the background there are modern cars, utility poles, and a lightly clouded sky. The image carries cinematic lighting, realistic textures, and a fairy-tale atmosphere.`,
      future:`Set in a futuristic science-fiction city in the year 2325, Carl Fredricksen’s house is reimagined three hundred years into the future. Its original purple roof, cylindrical chimney, and projecting windows are preserved, but the entire facade is clad in matte composite panels designed for energy efficiency. The windows are now glowing smart glass, and the chimney has transformed into a transparent dome. The carrying balloons are no longer latex; they are semi-transparent neon artificial balloons supported by anti-gravity technology. The house floats independently above the city, surrounded by ultra-vertical megastructures, air corridors, flying vehicles, and illuminated energy lines.`,

function openImageDB(){
  return new Promise((resolve, reject)=>{
    if(!window.indexedDB){ reject(new Error('IndexedDB desteklenmiyor.')); return; }
    const req = indexedDB.open(IMAGE_DB_NAME, 1);
    req.onupgradeneeded = ()=>{
      const db = req.result;
      if(!db.objectStoreNames.contains(IMAGE_STORE_NAME)) db.createObjectStore(IMAGE_STORE_NAME);
    };
    req.onsuccess = ()=>resolve(req.result);
    req.onerror = ()=>reject(req.error || new Error('Veritabanı açılamadı.'));
  });
}
async function idbSet(key, value){
  const db = await openImageDB();
  return new Promise((resolve, reject)=>{
    const tx = db.transaction(IMAGE_STORE_NAME, 'readwrite');
    tx.objectStore(IMAGE_STORE_NAME).put(value, key);
    tx.oncomplete = ()=>{ db.close(); resolve(true); };
    tx.onerror = ()=>{ db.close(); reject(tx.error || new Error('Görsel kaydedilemedi.')); };
  });
}
async function idbGet(key){
  const db = await openImageDB();
  return new Promise((resolve, reject)=>{
    const tx = db.transaction(IMAGE_STORE_NAME, 'readonly');
    const req = tx.objectStore(IMAGE_STORE_NAME).get(key);
    req.onsuccess = ()=>{ db.close(); resolve(req.result || null); };
    req.onerror = ()=>{ db.close(); reject(req.error || new Error('Görsel okunamadı.')); };
  });
}
async function idbDelete(key){
  const db = await openImageDB();
  return new Promise((resolve, reject)=>{
    const tx = db.transaction(IMAGE_STORE_NAME, 'readwrite');
    tx.objectStore(IMAGE_STORE_NAME).delete(key);
    tx.oncomplete = ()=>{ db.close(); resolve(true); };
    tx.onerror = ()=>{ db.close(); reject(tx.error || new Error('Görsel silinemedi.')); };
  });
}

function fileToDataURL(file){
  return new Promise(resolve=>{
    if(!file){ resolve(''); return; }
    const r = new FileReader();
    r.onload = ()=>resolve(r.result);
    r.onerror = ()=>resolve('');
    r.readAsDataURL(file);
  });
}
function compressImageDataURL(dataURL, maxSize=1600, quality=0.82){
  return new Promise(resolve=>{
    const img = new Image();
    img.onload = ()=>{
      const ratio = Math.min(1, maxSize / Math.max(img.width, img.height));
      const canvas = document.createElement('canvas');
      canvas.width = Math.max(1, Math.round(img.width * ratio));
      canvas.height = Math.max(1, Math.round(img.height * ratio));
      const ctx = canvas.getContext('2d');
      ctx.drawImage(img, 0, 0, canvas.width, canvas.height);
      resolve(canvas.toDataURL('image/jpeg', quality));
    };
    img.onerror = ()=>resolve(dataURL);
    img.src = dataURL;
  });
}
async function fileToStoredImage(file){
  const dataUrl = await fileToDataURL(file);
  if(!dataUrl) return '';
  return await compressImageDataURL(dataUrl);
}

const stopWords = new Set(['ve','ile','bir','bu','için','the','and','for','with','from','that','this','çok','gibi','daha','olarak']);
const timeLex = {
  past:['geçmiş','tarihsel','eski','nostaljik','antik','viktorya','gotik','klasik','tarihsel','19','18','historical','past','traditional','vintage','aged'],
  present:['günümüz','çağdaş','modern','güncel','kent','şehir','çağdaş','minimalist','present','contemporary','urban','current','realistic'],
  future:['gelecek','ütopik','spekülatif','dijital','otonom','adaptif','holografik','akıllı','future','utopian','speculative','futuristic','smart']
};
const narrativeLex = ['atmosfer','ışık','gölge','malzeme','beton','cam','ahşap','hikaye','duygu','anlatı','mekan','mekânsal','iç','dış','şömine','cephe','yüzey','form','mood','light','shadow','material','concrete','glass','wood','story','emotion','space','interior','facade','surface','form'];
function tokenize(text){
  return (text||'').toLowerCase().replace(/[^\p{L}\p{N}\s]/gu,' ').split(/\s+/).filter(x => x && x.length>2 && !stopWords.has(x));
}
function promptMetrics(text, phaseKey){
  const tokens = tokenize(text);
  const unique = [...new Set(tokens)];
  const temporalHits = unique.filter(x=>timeLex[phaseKey].includes(x)).length;
  const narrativeHits = unique.filter(x=>narrativeLex.includes(x)).length;
  const conceptualVariety = Math.min(5, +(unique.length/4).toFixed(2));
  const temporalSuitability = Math.min(5, +(temporalHits*1.5 + (temporalHits?0.5:0)).toFixed(2));
  const narrativeVariety = Math.min(5, +(narrativeHits*1.2 + Math.min(tokens.length/14,1.5)).toFixed(2));
  const quality = +((conceptualVariety*0.4 + temporalSuitability*0.35 + narrativeVariety*0.25)).toFixed(2);
  return {tokens, uniqueCount:unique.length, wordCount:tokens.length, conceptualVariety, temporalSuitability, narrativeVariety, quality};
}
function analyzeSet(setObj){
  const past = promptMetrics(setObj.past,'past');
  const present = promptMetrics(setObj.present,'present');
  const future = promptMetrics(setObj.future,'future');
  const temporalDifferentiation = +(((Math.abs(past.quality-present.quality)+Math.abs(past.quality-future.quality)+Math.abs(present.quality-future.quality))/3)).toFixed(2);
  return {
    past,present,future,
    avgQuality:+((past.quality+present.quality+future.quality)/3).toFixed(2),
    avgWords:+((past.wordCount+present.wordCount+future.wordCount)/3).toFixed(1),
    avgUnique:+((past.uniqueCount+present.uniqueCount+future.uniqueCount)/3).toFixed(1),
    temporalDifferentiation
  };
}
function keywordFreq(texts, n=8){
  const freq = {};
  (texts||[]).forEach(txt=>{
    tokenize(txt).forEach(t=>{ freq[t] = (freq[t]||0)+1; });
  });
  return Object.entries(freq).sort((a,b)=>b[1]-a[1]).slice(0,n);
}

function aggregateTemporalKeywords(kind, n=6){
  const pool = [];
  students.forEach(s=>{
    const setObj = s[kind];
    if(!setObj) return;
    pool.push(...tokenize(setObj.past), ...tokenize(setObj.present), ...tokenize(setObj.future));
  });
  const temporalSet = new Set([...timeLex.past, ...timeLex.present, ...timeLex.future]);
  const freq = {};
  pool.filter(t=>temporalSet.has(t)).forEach(t=>freq[t]=(freq[t]||0)+1);
  return Object.entries(freq).sort((a,b)=>b[1]-a[1]).slice(0,n);
}

async function addOrUpdateStudent(){
  const id = document.getElementById('studentId').value.trim();
  if(!id){ alert('Öğrenci kodu gerekli.'); return; }

  const existing = students.find(s => s.id === editingId) || students.find(s => s.id === id);
  const obj = {
    id,
    artworkName: document.getElementById('artworkName').value.trim(),
    artworkType: document.getElementById('artworkType').value,
    tools:{
      text: normalizeTools(collectChecked('.tool-text'), document.getElementById('otherTextTool').value),
      image: normalizeTools(collectChecked('.tool-image'), document.getElementById('otherImageTool').value),
    },
    vize:{
      past: document.getElementById('vPast').value.trim(),
      present: document.getElementById('vPresent').value.trim(),
      future: document.getElementById('vFuture').value.trim(),
      images:{
        past: existing?.vize?.images?.past || '',
        present: existing?.vize?.images?.present || '',
        future: existing?.vize?.images?.future || ''
      }
    },
    final:{
      past: document.getElementById('fPast').value.trim(),
      present: document.getElementById('fPresent').value.trim(),
      future: document.getElementById('fFuture').value.trim(),
      images:{
        past: existing?.final?.images?.past || '',
        present: existing?.final?.images?.present || '',
        future: existing?.final?.images?.future || ''
      }
    }
  };

  const files = [
    ['vize','past','vPastImg'],['vize','present','vPresentImg'],['vize','future','vFutureImg'],
    ['final','past','fPastImg'],['final','present','fPresentImg'],['final','future','fFutureImg']
  ];
  for(const [phase,key,inputId] of files){
    const file = document.getElementById(inputId).files[0];
    if(file) obj[phase].images[key] = await fileToStoredImage(file);
  }

  const idx = students.findIndex(s => s.id === editingId || s.id === id);
  if(idx >= 0){
    const oldId = students[idx].id;
    students[idx] = obj;
    if(oldId !== id && rubrics[oldId]){
      rubrics[id] = rubrics[oldId];
      delete rubrics[oldId];
    }
  } else students.push(obj);

  ensureRubric(id);
  try{
    await saveStudents();
    saveRubrics();
    editingId = null;
    renderAll();
  }catch(err){
    console.error(err);
    alert('Kayıt sırasında depolama hatası oluştu. Tarayıcı depolama izinlerini kontrol edin.');
  }
}

async function deleteStudent(id){
  students = students.filter(s=>s.id !== id);
  delete rubrics[id];
  await idbDelete(id).catch(()=>null);
  await saveStudents();
  saveRubrics();
  if(editingId===id) editingId = null;
  renderAll();
}

    }
    return fallback;
  };
  return {
    conceptual: pick([
      ['Steampunk', ['steampunk']],
      ['Historical', ['19th', 'ancient', 'roman', 'gothic', 'edo', 'victorian']],
      ['Contemporary', ['modern', '2025', 'contemporary', 'suburban', 'urban']],
      ['Futuristic', ['future', 'futuristic', '2325', '3000', 'utopian', 'science-fiction']],

    ]),
    atmosphere: pick([
      ['Dramatic', ['dramatic', 'cinematic']],
      ['Mysterious', ['mysterious', 'mystical']],
      ['Balanced', ['balanced', 'controlled', 'calm']],
      ['Warm', ['warm', 'cozy', 'golden']],
      ['Dim', ['dim', 'dark', 'shadow', 'low light']],
      ['Dense', ['dense', 'oppressive', 'claustrophobic']],
      ['Magical', ['magical', 'enchanted']],

      ${students.map(s=>`
        <div class="rubric-card">
          <div class="rubric-head"><div><div class="rubric-title">${s.id}</div><div class="small">${s.artworkName}</div></div></div>
          ${rubricPreviewBlock(s.vize)}
          ${rubricInputs(s.id,'vize')}
        </div>`).join('')}
    </div>

    <div class="card" style="margin-top:16px"><h2>Final Rubrik Değerlendirmesi</h2>
      ${students.map(s=>`
        <div class="rubric-card">
          <div class="rubric-head"><div><div class="rubric-title">${s.id}</div><div class="small">${s.artworkName}</div></div></div>
          ${rubricPreviewBlock(s.final)}
          ${rubricInputs(s.id,'final')}
        </div>`).join('')}
    </div>
  `;

  const chartCanvas = document.getElementById('rubricStudentChart');
  if(chartCanvas){
    charts.rubricStudentChart = new Chart(chartCanvas, {
      type:'bar',
      data:{labels:students.map(s=>s.id), datasets:[{data:studentVizeMeans, label:'Vize Ortalama'},{data:studentFinalMeans, label:'Final Ortalama'}]},
      options:{responsive:true, maintainAspectRatio:false, scales:{y:{beginAtZero:true, max:5}}}
    });
  }
}

function renderFindings(){
  const el = document.getElementById('tab-findings');
  if(!students.length){ el.innerHTML = '<div class="card empty">Veri girişi yapın.</div>'; return; }

  const vTemporalKeywords = aggregateTemporalKeywords('vize');
  const fTemporalKeywords = aggregateTemporalKeywords('final');
  const labels = students.map(s=>s.id);
  const studentVizeMeans = students.map(s=>avgRubric((rubrics[s.id]||{}).vize || {}));
  const studentFinalMeans = students.map(s=>avgRubric((rubrics[s.id]||{}).final || {}));
  const ranking = students.map(s=>({id:s.id, avg:avgRubric((rubrics[s.id]||{}).final || {})})).sort((a,b)=>b.avg-a.avg);

  el.innerHTML = `
    <div class="notice">Aşağıdaki bulgular, rubrik puanları ve destekleyici dil verileri birlikte değerlendirilerek oluşturulmuştur.</div>
    <div class="grid g2" style="margin-bottom:16px">
      <div class="card">
        <h2>Vize Sürecinde Öne Çıkan Zaman Kavramları</h2>
        <p class="sub">Vize promptlarında en sık tekrar eden zamansal anahtar sözcükler</p>
        <div class="kws">${renderKeywordBadges(vTemporalKeywords)}</div>
      </div>
      <div class="card">
        <h2>Final Sürecinde Öne Çıkan Zaman Kavramları</h2>
        <p class="sub">Final promptlarında en sık tekrar eden zamansal anahtar sözcükler</p>
        <div class="kws">${renderKeywordBadges(fTemporalKeywords)}</div>
      </div>
    </div>
    <div class="card"><h2>Öğrencilerin Toplam Rubrik Ortalamaları</h2><p class="sub">Vize ve final aşamalarında öğrenci bazlı toplam rubrik ortalamaları</p><div class="chartbox"><canvas id="findingsRubricTotals"></canvas></div></div>
    <div class="card" style="margin-top:16px">
      <div class="finding"><strong>Rubrik ortalamaları:</strong> Öğrencilerin vize rubrik ortalaması ${mean(studentVizeMeans)} iken final rubrik ortalaması ${mean(studentFinalMeans)} olarak hesaplanmıştır. Bu artış, final aşamasında daha kontrollü ve tutarlı üretimler yapıldığını göstermektedir.</div>
      <div class="finding"><strong>Zaman kavramları:</strong> Vize sürecinde öne çıkan kavramlar ${vTemporalKeywords.length ? vTemporalKeywords.map(([k])=>`“${k}”`).join(', ') : 'belirgin biçimde saptanamamıştır'}. Final sürecinde ise ${fTemporalKeywords.length ? fTemporalKeywords.map(([k])=>`“${k}”`).join(', ') : 'belirgin biçimde saptanamamıştır'}. Bu dağılım, öğrencilerin her iki aşamada da zaman katmanlarını görünür kılmaya çalıştığını göstermektedir.</div>
      <div class="finding"><strong>En yüksek final ortalaması:</strong> Final rubrik değerlendirmesine göre en yüksek ortalamaya sahip öğrenci <strong>${ranking[0]?.id || '-'}</strong> olmuştur.</div>
      <div class="finding"><strong>Yöntemsel not:</strong> Sistem, yaratıcılığı tek başına ölçen mutlak bir araç değil; kavramsal gelişim, mekânsal kurgu, atmosfer, teknolojik düzey ve görsel üretim ilişkisini görünür kılan çok boyutlu bir değerlendirme çerçevesidir.</div>
    </div>
  `;
  charts.findingsRubricTotals = new Chart(document.getElementById('findingsRubricTotals'), {
    type:'bar',
    data:{labels, datasets:[{data:studentVizeMeans, label:'Vize Ortalama'},{data:studentFinalMeans, label:'Final Ortalama'}]},
    options:{responsive:true, maintainAspectRatio:false, scales:{y:{beginAtZero:true, max:5}}}
  });
}

function renderAll(){
  renderDataTab();
  const active = document.querySelector('.tab.active')?.id || 'tab-data';
  renderVisible(active);
}

async function initApp(){
  buildTabs();
  await loadStudents();
  loadRubrics();
  renderAll();
}
initApp();
window.addEventListener('resize', ()=> {
  const active = document.querySelector('.tab.active')?.id;
  if(active) setTimeout(()=>renderVisible(active), 120);
});
</script>
</body>
</html>
